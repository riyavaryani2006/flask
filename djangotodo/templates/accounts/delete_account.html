{% extends "base.html" %}
{% block title %}Delete account &middot; Django To-Do{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Delete account</h1>
  <p class="muted">This permanently deletes your account and all of your tasks. It cannot be undone.</p>
  <form method="post" onsubmit="return confirm('Permanently delete your account and all tasks?');">
    {% csrf_token %}
    <div class="field">
      <label for="delete_password">Confirm with your password</label>
      <input id="delete_password" type="password" name="password" required autocomplete="current-password">
    </div>
    <div class="form-actions">
      <button type="submit" class="danger">Delete my account</button>
      <a class="btn secondary" href="{% url 'account' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

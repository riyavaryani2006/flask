{% extends "base.html" %}
{% block title %}Log in &middot; Django To-Do{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "_form_fields.html" %}
    <div class="form-actions">
      <button type="submit">Log in</button>
      <span class="muted">No account? <a href="{% url 'signup' %}">Sign up</a></span>
    </div>
  </form>
</div>
{% endblock %}

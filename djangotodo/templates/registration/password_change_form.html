{% extends "base.html" %}
{% block title %}Change password &middot; Django To-Do{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Change password</h1>
  <form method="post">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <div class="form-actions">
      <button type="submit">Update password</button>
      <a class="btn secondary" href="{% url 'account' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Sign up &middot; Django To-Do{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create your account</h1>
  <form method="post">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <div class="form-actions">
      <button type="submit">Sign up</button>
      <span class="muted">Already registered? <a href="{% url 'login' %}">Log in</a></span>
    </div>
  </form>
</div>
{% endblock %}

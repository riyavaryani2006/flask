{% extends "base.html" %}
{% block title %}{{ heading }} &middot; Django To-Do{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ heading }}</h1>
  <form method="post">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <div class="form-actions">
      <button type="submit">{{ submit_label }}</button>
      <a class="btn secondary" href="{% url 'task_list' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

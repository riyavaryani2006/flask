{% extends "base.html" %}
{% block title %}Delete task &middot; Django To-Do{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Delete task?</h1>
  <p>&ldquo;{{ object.title }}&rdquo; will be permanently deleted.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button type="submit" class="danger">Yes, delete</button>
      <a class="btn secondary" href="{% url 'task_list' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

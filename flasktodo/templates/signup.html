{% extends "base.html" %}
{% block title %}Sign up &middot; Flask To-Do{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create your account</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" value="{{ form.username }}" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" autofocus autocomplete="username">
      <div class="help">3-30 characters: letters, numbers, underscore.</div>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" value="{{ form.email }}" required maxlength="254" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required minlength="8" autocomplete="new-password">
      <div class="help">At least 8 characters.</div>
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" name="confirm" required minlength="8" autocomplete="new-password">
    </div>
    <div class="form-actions">
      <button type="submit">Sign up</button>
      <span class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></span>
    </div>
  </form>
</div>
{% endblock %}
